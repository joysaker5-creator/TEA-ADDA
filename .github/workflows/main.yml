name: Build TEA ADDA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি ক্লোন করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. জিপ ফাইল আনজিপ করে সম্পূর্ণ সোর্স কোড রিস্টোর করা
      - name: Extract Project Zip & Restore Source Code
        run: |
          echo "=== সোর্স কোড পরীক্ষা করা হচ্ছে ==="
          if [ -f "ludo-voice-connect.zip" ]; then
            echo "ludo-voice-connect.zip পাওয়া গেছে! ফাইলগুলো আনজিপ করা হচ্ছে..."
            unzip -o ludo-voice-connect.zip
          fi
          
          # যদি src ফোল্ডার না থাকে এবং ফাইলগুলো রুটে থাকে তবে src তৈরি করা
          if [ ! -d "src" ]; then
            mkdir -p src
            [ -f "main.tsx" ] && cp main.tsx src/main.tsx
            [ -f "App.tsx" ] && cp App.tsx src/App.tsx
            [ -f "types.ts" ] && cp types.ts src/types.ts
            [ -f "index.css" ] && cp index.css src/index.css
          fi

          echo "=== ফাইল ভেরিফিকেশন সম্পন্ন ==="
          ls -la src/

      # ৩. Node.js ২২ সেটআপ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ৪. জাভা JDK ২১ সেটআপ
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ৫. ডিপেনডেন্সি ইনস্টল
      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      # ৬. ফ্রন্টএন্ড কোড বিল্ড (dist ফোল্ডার তৈরি)
      - name: Build Web Frontend
        run: npx vite build

      # ৭. ক্যাপাসিটর স্টেবল LTS দিয়ে অ্যান্ড্রয়েড প্রজেক্ট কনফিগার
      - name: Setup Android Project
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --save-dev
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.teaadda.game",
            "appName": "TEA ADDA",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      # ৮. অ্যান্ড্রয়েড লাইসেন্স অনুমোদন ও APK কম্পাইল
      - name: Build APK with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ৯. ডাউনলোড করার জন্য APK ফাইল আপলোড
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: TEA-ADDA-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
