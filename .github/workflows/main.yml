name: Build TEA ADDA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি ক্লোন
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. আধুনিক Node.js ২২ সেটআপ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ৩. জাভা JDK ২১ সেটআপ (গিটহাবের অফিশিয়াল Temurin ডিস্ট্রিবিউশন)
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ৪. প্রজেক্টের প্যাকেজ ইনস্টল
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ৫. ফ্রন্টএন্ড কোড বিল্ড (dist ফোল্ডার তৈরি)
      - name: Build Web Frontend
        run: npx vite build

      # ৬. ক্যাপাসিটর স্টেবল LTS (v6) দিয়ে অ্যান্ড্রয়েড কনফিগার
      - name: Setup Android Project
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --save-dev
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.teaadda.game",
            "appName": "TEA ADDA",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      # ৭. অ্যান্ড্রয়েড APK কম্পাইল (Gradle)
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ৮. ডাউনলোড করার জন্য APK ফাইল আপলোড
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: TEA-ADDA-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
