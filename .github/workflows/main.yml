name: Build TEA ADDA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি ক্লোন
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. আধুনিক Node.js সেটআপ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ৩. জাভা JDK 17 সেটআপ
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৪. অ্যান্ড্রয়েড এসডিকে টুলস সেটআপ
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ৫. ডিপেনডেন্সি ইনস্টলেশন
      - name: Install Project Dependencies
        run: npm install --force

      # ৬. ফ্রন্টএন্ড প্রজেক্ট বিল্ড
      - name: Build Web Frontend
        run: npm run build || npx vite build

      # ৭. ক্যাপাসিটর দিয়ে অ্যান্ড্রয়েড সেটআপ
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --force
          npx cap init "TEA ADDA" "com.teaadda.game" --web-dir dist
          npx cap add android || true
          npx cap sync android

      # ৮. গ্রেডেল দিয়ে APK তৈরি করা
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ৯. তৈরি হওয়া APK ফাইল আপলোড (ডাউনলোডের জন্য)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEA-ADDA-APK-File
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
