name: Build TEA ADDA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout Repository
        uses: actions/checkout@v4

      (Self Healing)
      - name: Fix File Paths and Verify Structure
        run: |
          echo "
          ls -la
          
     
          if [ ! -d "src" ] && [ -d "TEA-ADDA/src" ]; then
           
            cp -r TEA-ADDA/* .
          fi

           
          if [ -f "src/Main.tsx" ]; then
            mv src/Main.tsx src/main.tsx
          fi

          # index.html  (/src/main.tsx -> ./src/main.tsx)
          if [ -f "index.html" ]; then
            sed -i 's|/src/main.tsx|./src/main.tsx|g' index.html
          fi

        

     
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      
      - name: Build Web Frontend
        run: npx vite build

     
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 --save-dev
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.teaadda.game",
            "appName": "TEA ADDA",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

    
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

 
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: TEA-ADDA-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
