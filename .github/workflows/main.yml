name: Build TEA ADDA APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি ক্লোন
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ৩. জাভা JDK ১৭ সেটআপ
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ৪. ডিপেনডেন্সি ইনস্টলেশন (লেগেসি পিয়ার ডিপেনডেন্সিসহ)
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ৫. ফ্রন্টএন্ড অ্যাপ বিল্ড (APK-র জন্য dist ফোল্ডার তৈরি)
      - name: Build Web Frontend
        run: npx vite build

      # ৬. ক্যাপাসিটর অ্যান্ড্রয়েড প্ল্যাটফর্ম কনফিগার
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.teaadda.game",
            "appName": "TEA ADDA",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      # ৭. অ্যান্ড্রয়েড APK কম্পাইল
      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ৮. ডাউনলোড করার জন্য APK Artifact তৈরি
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEA-ADDA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
