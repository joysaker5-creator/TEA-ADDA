name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি চেকআউট
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ (লক-ফাইল ক্যাশ ছাড়া)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ৩. জাভা JDK ১৭ সেটআপ
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ৪. ডিপেনডেন্সি ইনস্টল (লক-ফাইল ছাড়াই কাজ করবে)
      - name: Install Project Dependencies
        run: npm install

      # ৫. ওয়েব অ্যাপ্লিকেশন বিল্ড
      - name: Build Web Dist
        run: npm run build

      # ৬. ক্যাপাসিটর ও অ্যান্ড্রয়েড কনফিগারেশন
      - name: Setup Capacitor & Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "TEA ADDA" "com.teaadda.game" --web-dir dist
          npx cap add android
          npx cap sync android

      # ৭. অ্যান্ড্রয়েড APK কম্পাইল
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # ৮. সফলভাবে তৈরি হওয়া APK ফাইল আপলোড (ডাউনলোডের জন্য)
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TEA-ADDA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
